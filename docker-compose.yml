version: '3.8'

services:
  abcd2bioschema:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abcd2bioschema
    #restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - RUST_LOG=info
      - GFBIO_BASE_URL=https://transformation.gfbio.org/api
      - TEMP_DIR=/app/temp
    volumes:
      - abcd_temp:/app/temp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    env_file:
      - .env

volumes:
  abcd_temp:
    driver: local
